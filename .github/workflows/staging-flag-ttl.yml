# SIGNUP-2 Phase 2F / 2G safeguard (2026-10-26).
#
# Narrow, staging-only safety net: a scheduled workflow that
# auto-unsets a short allowlist of test-only staging flags.  Any
# allowlisted flag that is set on `spectre-staging` is unconditionally
# unset every run.  Operators MUST still unset their flags at the end
# of a test window; this safeguard only guarantees that a stalled
# run cannot leave the flags ON indefinitely.
#
# Scope:
#   - Allowlist: four SIGNUP-2 test-only flags (2B / 2D / 2F x 2 / 2G x 2).
#   - Only touches the `spectre-staging` app.
#   - Only runs secret UNSET -- never SET.
#   - Zero production surface.
#   - Max intended test window: 120 minutes (the workflow cron is
#     every 15 minutes, so any flag older than ~15 min is unset).
#
# Failure alerts: on any step failure, the workflow exits non-zero
# so the standard GitHub Actions failure notification fires.

name: Staging Flag TTL Safeguard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: staging-flag-ttl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unset-stale-flags:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Guard — FLY_API_TOKEN present
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is missing on the staging environment."
            exit 2
          fi

      - name: Install flyctl
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -sSfL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Enumerate currently-set allowlisted flags
        id: snapshot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Enumerating current secrets on spectre-staging..."
          raw=$(flyctl secrets list --app spectre-staging --json)
          printf '%s' "$raw" > /tmp/secrets.json
          names=$(printf '%s' "$raw" | jq -r '.[].Name')
          allowlist="SPECTRE_SIGNUP_2B_ATTESTATION_LIVE
          SPECTRE_SIGNUP_2D_OPERATOR_RELEASE_LIVE
          SPECTRE_SIGNUP_2F_ACTIVATION_LIVE
          SPECTRE_SIGNUP_2F_ALLOW_TESTONLY_SWEEP
          SPECTRE_SIGNUP_2G_PROVISIONING_LIVE
          SPECTRE_SIGNUP_2G_ALLOW_TESTONLY_PROVISIONING"
          present=""
          for n in $allowlist; do
            if echo "$names" | grep -qx "$n"; then
              present="${present} ${n}"
            fi
          done
          present="$(echo "$present" | tr -s ' ')"
          echo "present_flags=$present" >> $GITHUB_OUTPUT
          echo "Allowlisted flags currently SET on staging: $present"

      - name: Unset stale allowlisted flags
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PRESENT: ${{ steps.snapshot.outputs.present_flags }}
        run: |
          set -euo pipefail
          if [ -z "$(echo "$PRESENT" | tr -d '[:space:]')" ]; then
            echo "No allowlisted flags present.  Nothing to unset."
            exit 0
          fi
          # Max test window is 120 minutes.  The cron runs every 15
          # minutes.  `flyctl secrets list --json` does not include a
          # "set-at" timestamp, so we unset UNCONDITIONALLY on every
          # tick.  Operators who need a longer window must disable
          # this workflow for the duration (and re-enable it after).
          for name in $PRESENT; do
            echo "::notice::Unsetting staging flag $name (TTL safeguard)"
            flyctl secrets unset --app spectre-staging "$name" || {
              echo "::error::Failed to unset $name"
              exit 1
            }
          done
          # Health probe after the unset.  Secrets changes trigger a
          # rolling restart; wait briefly, then confirm /api/health.
          sleep 30
          if ! curl -sSf -o /dev/null -w "%{http_code}" https://staging.spectreautomation.com/api/health | grep -q 200; then
            echo "::warning::/api/health did not return 200 within 30s after flag unset"
          fi

      - name: Summary
        if: always()
        env:
          PRESENT: ${{ steps.snapshot.outputs.present_flags }}
        run: |
          {
            echo "### Staging flag TTL safeguard — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            if [ -z "$(echo "$PRESENT" | tr -d '[:space:]')" ]; then
              echo "- No allowlisted flags were set on \`spectre-staging\`."
              echo "- No action taken."
            else
              echo "- Flags unset: \`$PRESENT\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
