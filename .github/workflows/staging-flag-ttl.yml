# SIGNUP-2 Phase 2H closure (2026-10-26) -- staging flag TTL safeguard.
#
# Scheduled every 5 minutes.  Reads GitHub Actions variables of the
# form `STAGING_FLAG_<FLAG>_WINDOW` with value `<activation>|<expiry>`
# (written by `.github/workflows/staging-flag-activate.yml`).  For
# each variable:
#   - If expiry < now: unset the matching Fly secret + delete the
#     variable.
#   - If expiry >= now: keep the Fly secret (valid in-window test).
#   - If value malformed OR missing expiry: treat as EXPIRED (safe
#     default); unset + delete.
#   - If a Fly secret is set on the allowlist WITHOUT a matching
#     variable: safe default is to unset (operator did not follow
#     the activation workflow contract).
#
# Protection against stale cleanup disabling a newly-activated test
# (founder closure §8): the variable is RE-WRITTEN by the activate
# workflow on every re-activation, so the new expiry replaces the
# old one before this TTL job runs.  There is no path where a stale
# variable can cause a newly-activated flag to be unset.
#
# Emergency cleanup: dispatch with `confirm_emergency_unset=true` to
# unset ALL allowlisted flags regardless of expiry, and delete every
# matching variable.
#
# Zero production access.  Allowlist-gated.  Failure propagates via
# standard GitHub Actions failure notification.

name: Staging Flag TTL Safeguard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      confirm_emergency_unset:
        description: "Pass 'true' to UNSET every allowlisted flag regardless of expiry (emergency cleanup)."
        required: false
        default: "false"
        type: string

concurrency:
  # Shared group with staging-flag-activate.yml so cleanup + activation
  # never execute simultaneously.  Per founder closure §3.
  group: staging-flag-mutex
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  cleanup-expired-flags:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Guard — FLY_API_TOKEN present
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN missing"; exit 2
          fi

      - name: Install flyctl
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -sSfL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Decide expired flags
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FORCE: ${{ inputs.confirm_emergency_unset }}
        run: |
          set -euo pipefail
          allowlist=(
            SPECTRE_SIGNUP_2B_ATTESTATION_LIVE
            SPECTRE_SIGNUP_2D_OPERATOR_RELEASE_LIVE
            SPECTRE_SIGNUP_2F_ACTIVATION_LIVE
            SPECTRE_SIGNUP_2F_ALLOW_TESTONLY_SWEEP
            SPECTRE_SIGNUP_2G_PROVISIONING_LIVE
            SPECTRE_SIGNUP_2G_ALLOW_TESTONLY_PROVISIONING
            SPECTRE_SIGNUP_2H_SUSPENSION_LIVE
          )
          fly_secrets=$(flyctl secrets list --app spectre-staging --json)
          gh_vars=$(gh variable list --repo "$REPO" --json name,value)
          now_epoch=$(date -u +%s)
          to_unset=""
          vars_to_delete=""
          for flag in "${allowlist[@]}"; do
            fly_set=$(printf '%s' "$fly_secrets" | jq -r --arg n "$flag" '[.[] | select(.name==$n)] | length')
            var_name="STAGING_FLAG_${flag}_WINDOW"
            var_val=$(printf '%s' "$gh_vars" | jq -r --arg n "$var_name" '.[] | select(.name==$n) | .value // ""')
            if [ "$FORCE" = "true" ]; then
              if [ "$fly_set" != "0" ]; then to_unset+=" $flag"; fi
              if [ -n "$var_val" ]; then vars_to_delete+=" $var_name"; fi
              continue
            fi
            if [ "$fly_set" = "0" ]; then
              # Fly secret not set.  If a variable still exists (stale),
              # delete it.
              if [ -n "$var_val" ]; then
                echo "::notice::$flag not set on Fly; deleting stale var $var_name"
                vars_to_delete+=" $var_name"
              fi
              continue
            fi
            # Fly secret is set.  Decide via variable's expiry.
            if [ -z "$var_val" ]; then
              echo "::notice::$flag set on Fly WITHOUT matching variable; treating as EXPIRED"
              to_unset+=" $flag"
              continue
            fi
            expiry=$(echo "$var_val" | awk -F'|' '{print $2}')
            if [ -z "$expiry" ]; then
              echo "::notice::$flag variable malformed (no expiry portion); treating as EXPIRED"
              to_unset+=" $flag"
              vars_to_delete+=" $var_name"
              continue
            fi
            exp_epoch=$(date -u -d "$expiry" +%s 2>/dev/null || echo 0)
            if [ "$exp_epoch" = "0" ]; then
              echo "::notice::$flag variable has unparsable expiry '$expiry'; treating as EXPIRED"
              to_unset+=" $flag"
              vars_to_delete+=" $var_name"
              continue
            fi
            if [ "$exp_epoch" -le "$now_epoch" ]; then
              echo "::notice::$flag expired at $expiry; unsetting"
              to_unset+=" $flag"
              vars_to_delete+=" $var_name"
            else
              echo "::notice::$flag within window (expires $expiry); keeping"
            fi
          done
          to_unset="$(echo "$to_unset" | tr -s ' ' | sed 's/^ //')"
          vars_to_delete="$(echo "$vars_to_delete" | tr -s ' ' | sed 's/^ //')"
          echo "to_unset=$to_unset" >> $GITHUB_OUTPUT
          echo "vars_to_delete=$vars_to_delete" >> $GITHUB_OUTPUT

      - name: Fresh-expiry re-check (defence in depth, founder §3)
        id: recheck
        if: ${{ steps.decide.outputs.to_unset != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.confirm_emergency_unset }}
          TO_UNSET: ${{ steps.decide.outputs.to_unset }}
          VARS_TO_DELETE: ${{ steps.decide.outputs.vars_to_delete }}
        run: |
          set -euo pipefail
          # Re-read every GH variable we were about to act on IMMEDIATELY
          # before the destructive step.  Even with the shared concurrency
          # group this is a cheap belt-and-braces check: if an activation
          # somehow refreshed the expiry window since `decide` ran, we
          # must NOT unset the Fly flag.  If the variable disappeared
          # (operator cleared it manually), keep it in the unset list.
          now_epoch=$(date -u +%s)
          final_unset=""
          final_vars=""
          gh_vars=$(gh variable list --repo "$REPO" --json name,value)
          for flag in $TO_UNSET; do
            var_name="STAGING_FLAG_${flag}_WINDOW"
            if [ "$FORCE" = "true" ]; then
              final_unset+=" $flag"
              # Delete the variable too if present.
              if printf '%s' "$gh_vars" | jq -e --arg n "$var_name" '.[] | select(.name==$n)' >/dev/null; then
                final_vars+=" $var_name"
              fi
              continue
            fi
            fresh_val=$(printf '%s' "$gh_vars" | jq -r --arg n "$var_name" '.[] | select(.name==$n) | .value // ""')
            if [ -z "$fresh_val" ]; then
              echo "::notice::$flag variable disappeared between decide and recheck; proceeding with unset"
              final_unset+=" $flag"
              continue
            fi
            fresh_exp=$(echo "$fresh_val" | awk -F'|' '{print $2}')
            fresh_epoch=$(date -u -d "$fresh_exp" +%s 2>/dev/null || echo 0)
            if [ "$fresh_epoch" = "0" ]; then
              echo "::notice::$flag re-read gave unparsable expiry '$fresh_exp'; proceeding with unset"
              final_unset+=" $flag"
              final_vars+=" $var_name"
              continue
            fi
            if [ "$fresh_epoch" -gt "$now_epoch" ]; then
              echo "::warning::$flag was refreshed between decide and recheck (now expires $fresh_exp); SKIPPING unset to protect the new activation window"
            else
              final_unset+=" $flag"
              final_vars+=" $var_name"
            fi
          done
          # Also carry over any orphan variables (fly secret absent)
          # that the decide step flagged for deletion.
          for v in $VARS_TO_DELETE; do
            case " $final_vars " in
              *" $v "*) : ;;  # already present
              *)
                # Only carry over if the variable is actually unused by any
                # currently-set fly secret.  The decide step already
                # validated this; just include.
                final_vars+=" $v" ;;
            esac
          done
          final_unset="$(echo "$final_unset" | tr -s ' ' | sed 's/^ //')"
          final_vars="$(echo "$final_vars" | tr -s ' ' | sed 's/^ //')"
          echo "final_unset=$final_unset" >> $GITHUB_OUTPUT
          echo "final_vars=$final_vars" >> $GITHUB_OUTPUT

      - name: Unset expired Fly secrets (post-recheck)
        if: ${{ steps.recheck.outputs.final_unset != '' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TO_UNSET: ${{ steps.recheck.outputs.final_unset }}
        run: |
          set -euo pipefail
          echo "::notice::Unsetting expired staging flags: $TO_UNSET"
          # shellcheck disable=SC2086
          flyctl secrets unset --app spectre-staging $TO_UNSET
          sleep 30
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://staging.spectreautomation.com/api/health)
          if [ "$code" != "200" ]; then
            echo "::warning::/api/health returned $code within 30s of flag unset"
          fi

      - name: Delete expired variables (post-recheck)
        if: ${{ steps.recheck.outputs.final_vars != '' || steps.decide.outputs.vars_to_delete != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VARS: ${{ steps.recheck.outputs.final_vars != '' && steps.recheck.outputs.final_vars || steps.decide.outputs.vars_to_delete }}
        run: |
          set -euo pipefail
          for v in $VARS; do
            gh variable delete --repo "$REPO" "$v" 2>&1 || true
          done

      - name: Summary
        if: always()
        env:
          DECIDED: ${{ steps.decide.outputs.to_unset }}
          FINAL_UNSET: ${{ steps.recheck.outputs.final_unset }}
          FINAL_VARS: ${{ steps.recheck.outputs.final_vars }}
          FORCE: ${{ inputs.confirm_emergency_unset }}
        run: |
          {
            echo "### Staging flag TTL safeguard — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "- Mode:                $([ "$FORCE" = "true" ] && echo "EMERGENCY UNSET" || echo "SCHEDULED / NORMAL")"
            echo "- Decided for unset:   \`${DECIDED:-<none>}\`"
            echo "- Final-recheck unset: \`${FINAL_UNSET:-<none>}\`"
            echo "- Vars deleted:        \`${FINAL_VARS:-<none>}\`"
            if [ -n "$DECIDED" ] && [ -z "$FINAL_UNSET" ]; then
              echo
              echo "- Fresh-expiry re-check SKIPPED every unset — at least one activation refreshed its window between decide and unset.  No destructive action taken (correct behaviour per founder closure §3)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
