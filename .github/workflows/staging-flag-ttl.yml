# SIGNUP-2 Phase 2F / 2G safeguard (2026-10-26, closure-verified).
#
# ------ KNOWN DESIGN LIMITATION ------
# `flyctl secrets list --app spectre-staging --json` returns only
# {name, digest, status} per secret.  Fly does NOT expose a
# per-secret `CreatedAt` / set-time timestamp.  The TTL safeguard
# can therefore NOT determine a flag's age purely from flyctl
# output.
#
# Pending the smallest corrective slice (a staging-only diagnostic
# endpoint on spectre-staging that returns the ISO-8601 value of
# the sibling `<FLAG>_EXPIRES_AT` env var, with a shared-secret
# header gate; proposed in docs/signup-2-phase-2g-closure-ttl-verification.md),
# the scheduled TTL path would have no reliable age proxy.
#
# Rather than:
#   - unconditionally unset every tick (interrupts valid tests), OR
#   - treat "no age proxy" as EXPIRED (interrupts valid tests), OR
#   - treat "no age proxy" as INFINITE-WINDOW (defeats the safeguard),
#
# this workflow currently runs in SAFE DIAGNOSTIC MODE:
#   - cron trigger is DISABLED.
#   - the workflow only runs on explicit workflow_dispatch.
#   - the workflow lists allowlisted flags + their sibling expiry
#     secret names, logs them, and takes NO destructive action
#     unless the operator passes `confirm_unset=true` on dispatch.
#   - the operator-triggered mode is itself gated on an inputs
#     allowlist so an accidental dispatch cannot unset arbitrary
#     secrets.
#
# When the corrective slice lands, re-enable the cron trigger + wire
# in the real age-proxy source.  Until then, operators continue to
# unset test flags manually at the end of each controlled window.
#
# Scope (unchanged):
#   - Allowlist: six SIGNUP-2 test-only flags (2B / 2D / 2F x 2 / 2G x 2).
#   - Only touches the `spectre-staging` app.
#   - Only UNSETS secrets; never SETs.
#   - environment: staging  (no production secret access).

name: Staging Flag TTL Safeguard (safe-diagnostic mode)

on:
  workflow_dispatch:
    inputs:
      confirm_unset:
        description: "Pass 'true' to unset the allowlisted flags; otherwise this is a read-only diagnostic."
        required: false
        default: "false"
        type: string

concurrency:
  group: staging-flag-ttl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose-or-unset:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Guard — FLY_API_TOKEN present
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is missing on the staging environment."
            exit 2
          fi

      - name: Install flyctl
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -sSfL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Enumerate currently-set allowlisted flags
        id: snapshot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          raw=$(flyctl secrets list --app spectre-staging --json)
          printf '%s' "$raw" > /tmp/secrets.json
          names=$(printf '%s' "$raw" | jq -r '.[].name')
          flags=(
            SPECTRE_SIGNUP_2B_ATTESTATION_LIVE
            SPECTRE_SIGNUP_2D_OPERATOR_RELEASE_LIVE
            SPECTRE_SIGNUP_2F_ACTIVATION_LIVE
            SPECTRE_SIGNUP_2F_ALLOW_TESTONLY_SWEEP
            SPECTRE_SIGNUP_2G_PROVISIONING_LIVE
            SPECTRE_SIGNUP_2G_ALLOW_TESTONLY_PROVISIONING
          )
          present=""
          expiry_present=""
          for n in "${flags[@]}"; do
            if echo "$names" | grep -qx "$n"; then
              present+=" $n"
              exp="${n}_EXPIRES_AT"
              if echo "$names" | grep -qx "$exp"; then
                expiry_present+=" $exp"
              fi
            fi
          done
          present="$(echo "$present" | tr -s ' ' | sed 's/^ //')"
          expiry_present="$(echo "$expiry_present" | tr -s ' ' | sed 's/^ //')"
          echo "Allowlisted flags set on staging: ${present:-<none>}"
          echo "Sibling expiry secrets set:       ${expiry_present:-<none>}"
          echo "present=$present" >> $GITHUB_OUTPUT
          echo "expiry_present=$expiry_present" >> $GITHUB_OUTPUT

      - name: Safe-diagnostic report (no destructive action by default)
        if: ${{ inputs.confirm_unset != 'true' }}
        env:
          PRESENT: ${{ steps.snapshot.outputs.present }}
          EXPIRIES: ${{ steps.snapshot.outputs.expiry_present }}
        run: |
          echo "::notice::Running in SAFE DIAGNOSTIC mode -- no secrets will be unset."
          echo "::notice::Allowlisted flags present: ${PRESENT:-<none>}"
          echo "::notice::Sibling expiry secrets present: ${EXPIRIES:-<none>}"
          echo "::notice::flyctl secrets list does not expose a per-secret CreatedAt timestamp."
          echo "::notice::To actually unset flags, dispatch with confirm_unset=true."
          echo "::notice::See docs/signup-2-phase-2g-closure-ttl-verification.md for the full writeup."

      - name: Unset allowlisted flags (operator-confirmed only)
        if: ${{ inputs.confirm_unset == 'true' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PRESENT: ${{ steps.snapshot.outputs.present }}
          EXPIRIES: ${{ steps.snapshot.outputs.expiry_present }}
        run: |
          set -euo pipefail
          to_unset="$(echo "$PRESENT $EXPIRIES" | tr -s ' ' | sed 's/^ //')"
          if [ -z "$(echo "$to_unset" | tr -d '[:space:]')" ]; then
            echo "No allowlisted flags present -- nothing to unset."
            exit 0
          fi
          echo "::notice::Operator-confirmed unset of: $to_unset"
          # shellcheck disable=SC2086
          flyctl secrets unset --app spectre-staging $to_unset
          sleep 30
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://staging.spectreautomation.com/api/health)
          if [ "$code" != "200" ]; then
            echo "::warning::/api/health returned $code within 30s after flag unset"
          fi

      - name: Summary
        if: always()
        env:
          PRESENT: ${{ steps.snapshot.outputs.present }}
          EXPIRIES: ${{ steps.snapshot.outputs.expiry_present }}
          CONFIRM: ${{ inputs.confirm_unset }}
        run: |
          {
            echo "### Staging flag TTL safeguard — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "- Mode: $([ "$CONFIRM" = "true" ] && echo "UNSET (operator-confirmed)" || echo "SAFE DIAGNOSTIC (read-only)")"
            if [ -z "$(echo "$PRESENT" | tr -d '[:space:]')" ]; then
              echo "- No allowlisted flags set on \`spectre-staging\`."
            else
              echo "- Allowlisted flags present: \`$PRESENT\`"
              echo "- Sibling expiry secrets present: \`${EXPIRIES:-<none>}\`"
            fi
            echo
            echo "See \`docs/signup-2-phase-2g-closure-ttl-verification.md\` for the design-limitation writeup."
          } >> "$GITHUB_STEP_SUMMARY"
