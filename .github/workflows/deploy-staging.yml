# DRH-1 (2026-09-19) — Spectre staging deployment (canonical path).
# FPP-1 (2026-09-20) — added branch-push trigger so the deployment
# controller does not require a founder click. The FLY_API_TOKEN is
# app-scoped to `spectre-staging`; production is unreachable regardless
# of trigger. Only branches under `staging-deploy/**` fire the workflow
# on push, so ordinary feature branches never wake CI.
#
# Two triggers, one code path:
#   1. workflow_dispatch (unchanged) — pick any ref, confirm with 'deploy'.
#   2. push on `staging-deploy/**` branches — the branch name itself is
#      the deliberate intent; the workflow deploys the pushed SHA of
#      that branch. Branch pattern is the ONLY new attack surface and
#      it can only reach spectre-staging.
#
# Architecture:
#   1. Checkout the exact requested SHA on a Linux runner.
#   2. Build the Docker image ONCE on the runner (docker buildx).
#   3. Push it to Fly's registry with a deterministic tag
#      (registry.fly.io/spectre-staging:sha-<short-sha>).
#   4. Invoke the deployment controller with --strategy=image so
#      flyctl deploys the already-pushed image (no re-build, no
#      double-image cycle).
#   5. Controller runs release_command (Prisma migrate) → rollout →
#      health verification → success or classified failure.
#   6. On success or failure the controller's JSON checkpoint and
#      text log are uploaded as workflow artifacts.
#
# Production is intentionally NOT reachable from this workflow.

name: Deploy — spectre-staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to deploy"
        required: true
        default: "main"
        type: string
      confirm:
        description: 'Type "deploy" to confirm you intend to update spectre-staging'
        required: true
        default: ""
        type: string
  # FPP-1 (2026-09-20) — non-founder deployment trigger.
  # Pushing to any branch under `staging-deploy/**` deploys that branch's
  # tip SHA. Ordinary dev branches never fire this workflow; the branch
  # namespace itself carries the deliberate intent that would otherwise
  # come from the manual `confirm: deploy` input.
  push:
    branches:
      - "staging-deploy/**"

# One staging deploy at a time. Never race Fly releases from CI.
# `cancel-in-progress: false` because cancelling a mid-migration deploy
# is not safe — let the current run reach a terminal state.
concurrency:
  group: deploy-spectre-staging
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Build + deploy to spectre-staging
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: staging

    steps:
      # FPP-1 (2026-09-20) — confirm guard only applies to workflow_dispatch.
      # A push to `staging-deploy/**` is itself the confirmation (namespace-
      # scoped, deliberate branch selection). See workflow header.
      - name: Guard — confirm text matches (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'deploy'
        run: |
          echo "::error::Confirmation text was '${{ github.event.inputs.confirm }}' — expected 'deploy'."
          exit 78

      - name: Resolve deployment ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.ref }}"
          else
            REF="${{ github.ref_name }}"
          fi
          echo "value=${REF}" >> "$GITHUB_OUTPUT"
          echo "::notice::Trigger=${{ github.event_name }} — resolving ref=${REF}"

      - name: Checkout ${{ steps.ref.outputs.value }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}
          # Full history not required; the deploy controller only needs
          # the top commit's SHA. Shallow clone is faster.
          fetch-depth: 1

      - name: Record SHA
        id: sha
        run: |
          FULL_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          IMAGE_TAG="sha-${SHORT_SHA}"
          IMAGE_REF="registry.fly.io/spectre-staging:${IMAGE_TAG}"
          # WI-SYNC-1b (2026-10-18) — worker image is a parallel
          # build from Dockerfile.worker, pushed to a distinct
          # registry (spectre-staging-worker), deployed to the
          # separate Fly app.  Both images carry the same SHA tag,
          # so a later version-compat check can assert web + worker
          # are serving the same code revision.
          WORKER_IMAGE_REF="registry.fly.io/spectre-staging-worker:${IMAGE_TAG}"
          echo "full_sha=${FULL_SHA}"               >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"             >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}"             >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}"             >> "$GITHUB_OUTPUT"
          echo "worker_image_ref=${WORKER_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploying ${FULL_SHA} → ${IMAGE_REF}"
          echo "::notice::Worker image → ${WORKER_IMAGE_REF}"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify flyctl authentication
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is not set on the staging environment."
            echo "::error::Founder must run: flyctl tokens create deploy -a spectre-staging"
            echo "::error::and upload the resulting token to the 'staging' environment as FLY_API_TOKEN."
            exit 2
          fi
          flyctl auth whoami

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Fly's registry accepts the deploy token as the password with
          # any username. This does NOT print the token.
          echo "$FLY_API_TOKEN" | docker login registry.fly.io -u x --password-stdin

      - name: Build + push image (single build → single tag → registry)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.sha.outputs.image_ref }}
          # Deterministic build metadata for provenance.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.full_sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          # Cache is remote-only (GitHub Actions cache). Runs consecutively
          # will hit cache on the deps + prisma-generate + npm run build
          # layers, taking a fresh build from ~7-8 min to ~2-3 min.
          cache-from: type=gha,scope=spectre-staging
          cache-to: type=gha,mode=max,scope=spectre-staging

      - name: Record pushed image digest
        id: image
        env:
          IMAGE_REF: ${{ steps.sha.outputs.image_ref }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{ json .Manifest }}' | jq -r '.digest // "unknown"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "::notice::Pushed image ${IMAGE_REF}@${DIGEST}"

      - name: Deploy via repository-owned controller
        env:
          FLY_API_TOKEN:                    ${{ secrets.FLY_API_TOKEN }}
          CI:                               "true"
          SPECTRE_DEPLOY_STRATEGY:          "image"
          SPECTRE_DEPLOY_IMAGE:             ${{ steps.sha.outputs.image_ref }}
          SPECTRE_STAGING_HEALTH_URL:       "https://staging.spectreautomation.com/api/health"
          GITHUB_RUN_ID:                    ${{ github.run_id }}
          GITHUB_SHA:                       ${{ steps.sha.outputs.full_sha }}
          GITHUB_REF_NAME:                  ${{ steps.ref.outputs.value }}
        run: npm run deploy:staging

      # WI-SYNC-1b (2026-10-18) — build + push the worker image.
      # Separate Dockerfile (Dockerfile.worker) runs bin/worker.ts
      # on `spectre-staging-worker`.  Uses its own cache scope so
      # the web build cache isn't invalidated by worker changes.
      # Independent registry destination — the FLY_API_TOKEN
      # (web-scoped) cannot push here; the Fly registry accepts
      # the deploy token in the password slot so the Fly-worker
      # token below is what grants push access.  We re-login
      # Docker with the worker token for the push step only.
      - name: Log in to Fly worker registry (worker-scoped token)
        if: success()
        env:
          FLY_WORKER_API_TOKEN: ${{ secrets.FLY_WORKER_API_TOKEN }}
        run: |
          if [ -z "$FLY_WORKER_API_TOKEN" ]; then
            echo "::error::FLY_WORKER_API_TOKEN secret is not set on the staging environment."
            echo "::error::Founder must run: flyctl tokens create deploy -a spectre-staging-worker"
            echo "::error::and upload the resulting token to the 'staging' environment as FLY_WORKER_API_TOKEN."
            exit 2
          fi
          echo "$FLY_WORKER_API_TOKEN" | docker login registry.fly.io -u x --password-stdin

      - name: Build + push WORKER image (Dockerfile.worker → worker registry)
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.sha.outputs.worker_image_ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.full_sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=spectre-staging-worker
          cache-to: type=gha,mode=max,scope=spectre-staging-worker

      - name: Deploy spectre-staging-worker (rolling, image-only)
        if: success()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WORKER_API_TOKEN }}
          WORKER_IMAGE: ${{ steps.sha.outputs.worker_image_ref }}
        run: |
          # Rolling, image-only.  No local docker build (image is
          # already pushed above).  No release_command on the
          # worker (per deploy/fly.worker.toml — the web app owns
          # Prisma migrations and ran them first).  wait-timeout
          # 180 s is generous for the worker's small startup.
          flyctl deploy \
            --app spectre-staging-worker \
            --config deploy/fly.worker.toml \
            --image "$WORKER_IMAGE" \
            --strategy rolling \
            --wait-timeout 180

      - name: Verify worker is healthy (machine state + image tag)
        if: success()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WORKER_API_TOKEN }}
          WORKER_IMAGE: ${{ steps.sha.outputs.worker_image_ref }}
          EXPECTED_IMAGE_TAG: ${{ steps.sha.outputs.image_tag }}
        run: |
          # Poll `flyctl status --json` for up to 180 s until every
          # worker machine reports state=started.  Then assert the
          # running image reference ends with the SAME sha-<short>
          # tag the web app was deployed with — proving web and
          # worker are serving compatible application versions
          # (WI-SYNC-1b §7).  A worker machine stuck in `starting`
          # or on a stale image fails the step.
          attempt=0
          while [ "$attempt" -lt 18 ]; do
            attempt=$((attempt + 1))
            STATUS_JSON=$(flyctl status --app spectre-staging-worker --json 2>/dev/null || echo '{}')
            # Collect machine states + their running image refs.
            STATES=$(echo "$STATUS_JSON" | jq -r '[.Machines[]?.state] | @csv' 2>/dev/null || echo "")
            IMAGES=$(echo "$STATUS_JSON" | jq -r '[.Machines[]?.image_ref.tag] | @csv' 2>/dev/null || echo "")
            NON_STARTED=$(echo "$STATUS_JSON" | jq -r '[.Machines[]? | select(.state != "started")] | length' 2>/dev/null || echo "99")
            echo "::notice::worker attempt=${attempt} states=${STATES} images=${IMAGES} non_started=${NON_STARTED}"
            if [ "$NON_STARTED" = "0" ]; then
              # Every machine is started.  Now assert image tag.
              WRONG_TAG=$(echo "$STATUS_JSON" | jq -r --arg t "$EXPECTED_IMAGE_TAG" '[.Machines[]? | select(.image_ref.tag != $t)] | length' 2>/dev/null || echo "99")
              if [ "$WRONG_TAG" = "0" ]; then
                echo "::notice::worker — all machines started on tag $EXPECTED_IMAGE_TAG"
                exit 0
              else
                echo "::error::worker — $WRONG_TAG machine(s) on a stale image tag (expected $EXPECTED_IMAGE_TAG)"
                echo "$STATUS_JSON" | jq '.Machines[] | {id,state,image_ref:.image_ref.tag}' || true
                exit 1
              fi
            fi
            sleep 10
          done
          echo "::error::worker — machines did not reach state=started within 180 s"
          echo "$STATUS_JSON" | jq '.Machines[]? | {id,state,image_ref:.image_ref.tag}' || true
          exit 1

      - name: Smoke — public login page reachable
        if: success()
        run: |
          # A public GET / that redirects to /login proves middleware +
          # routing are alive. Not authenticated — just a liveness check
          # beyond /api/health.
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -sS -o /tmp/root.html -w "%{http_code}" "https://staging.spectreautomation.com/" || echo "000")
            case "$HTTP_CODE" in
              200|301|302|307|308)
                echo "::notice::Smoke — GET / returned $HTTP_CODE"
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::Smoke — GET / did not return an OK status after 3 attempts"
          exit 1

      - name: Upload deployment checkpoint + log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-staging-${{ steps.sha.outputs.short_sha }}-${{ github.run_id }}
          path: test-results/deploy-staging/
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        env:
          IMAGE_REF: ${{ steps.sha.outputs.image_ref }}
          DIGEST: ${{ steps.image.outputs.digest }}
          FULL_SHA: ${{ steps.sha.outputs.full_sha }}
        run: |
          {
            echo "## Deployment summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit SHA | \`${FULL_SHA}\` |"
            echo "| Image | \`${IMAGE_REF}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Workflow run | ${{ github.run_id }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
